# ADR-000 D10 — where the calorically perfect assumption holds and where it breaks.
#
# UPDATED for the r4 re-baseline: M 3.50 / 26 km, T_inf = 222.65 K.
# The NACA 1135 table checks live in naca1135.toml; this file is only about the
# validity boundary of gamma = 1.4.
#
# [CORRECTED 2026-08-27] An earlier draft used a third status, `fail_if_used`,
# and used `known_limit` loosely to mean "this file documents a limitation".
# Implementing the harness showed both were wrong:
#
#   - `fail_if_used` behaved identically to `normal` (a failure breaks the
#     build), so it was a distinction with no mechanism behind it. Removed.
#   - `known_limit` means exactly one thing: THIS CASE IS EXPECTED TO FAIL, and
#     the failure is accepted and explained. A `known_limit` that passes is
#     reported as STALE_KNOWN_LIMIT. It is NOT a TODO marker; deferred work
#     belongs in the ADR.

# --- Must pass: the gas model itself ---------------------------------------

[[case]]
name    = "burner_gamma_at_1700k"
source  = "Air ideal-gas cp(T) tables, Cengel A-2b polynomial fit, 1700 K [TO VERIFY against NIST-JANAF or NASA Glenn coefficients]"
reason  = """
gamma = 1.4 is a FAILURE in the M4 burner and nozzle, not a known limit, so this
is a `normal` case the gas model must satisfy. Published cp(1700 K) values span
roughly 1.21-1.23 kJ/kg/K depending on source, giving gamma 1.304-1.310; the 1 %
tolerance reflects that spread, not sloppiness. The working fluid there is
combustion products, not air, which M4 must handle separately.
"""
inputs  = { temperature_k = 1700.0 }
expect  = { gamma = 1.304 }
rel_tol = 1e-2

[[case]]
name    = "gamma_at_300k"
source  = "Air ideal-gas cp correlation (Cengel A-2b cubic fit), 300 K [TO VERIFY]"
reason  = """
The cold anchor of the validity range. gamma comes out at 1.4005, so at ordinary
temperatures the calorically perfect assumption is not an approximation worth
arguing about. A gas model that drifted cold would fail here rather than silently
biasing M1 through M3.
"""
inputs  = { temperature_k = 300.0 }
expect  = { gamma = 1.400 }
rel_tol = 1e-3

[[case]]
name    = "gamma_at_design_point_freestream"
source  = "Cengel A-2b cubic fit, stated valid 273-1800 K, evaluated at the r4 freestream T = 222.65 K"
status  = "known_limit"
reason  = """
[FOUND WHILE BUILDING M2] THE DESIGN POINT FREESTREAM IS COLDER THAN THE GAS
MODEL IS FITTED FOR. T_inf = 222.65 K at 26 km; the correlation is stated valid
from 273 K. `gamma_air` refuses rather than extrapolating, so this case reports a
missing key rather than a wrong number — which is the correct behaviour and the
reason it is carried as a known limit instead of being quietly deleted.

Extrapolating the cubic to 222.65 K returns gamma = 1.4067, which is 0.5 % ABOVE
the true cold-air value of ~1.400. Note the direction: the error would flatter
the calorically perfect assumption exactly where this project relies on it being
sound. That is the worst possible direction for a silent extrapolation.

Consequence: nothing today, because M1 through M3 use the constant gamma = 1.4
and never call the correlation at freestream temperature. It becomes real if a
later module tries to use gamma(T) end to end. Resolution is a cp source valid
below 273 K — NIST-JANAF or the NASA Glenn coefficients, which is the same
[TO VERIFY] already open on the correlation itself.
"""
inputs  = { temperature_k = 222.65 }
expect  = { gamma = 1.400 }
rel_tol = 1e-3

# --- Expected to fail: the documented breakdown ------------------------------

[[case]]
name    = "stagnation_M35_h26km_calorically_imperfect"
source  = "docs/design-point.md section 3.1; air ideal-gas enthalpy tables (h(220 K) = 219.97, h(700 K) = 713.27, h(800 K) = 821.95 kJ/kg) [TO VERIFY]"
status  = "known_limit"
reason  = """
Expected 752.8 K is the thermally perfect result from energy conservation,
h0 = h_inf + V^2/2 with V^2/2 = 548.05 kJ/kg and interval-mean cp = 1.0337.
A calorically perfect model with gamma = 1.4 returns 768.1 K, so this case fails
by +2.0 % for as long as M2 is perfect-gas only. That is the documented limit,
and it disappears the day a cp(T) model lands — at which point the harness will
report STALE_KNOWN_LIMIT and this annotation should be deleted.

NOTE the wrong fix, recorded so it is not attempted twice: substituting
gamma(T0) ~ 1.358 back into T0/T = 1 + (gamma-1)/2*M^2 gives 711.4 K. That
formula is DT = V^2/(2*cp) with CONSTANT cp, so it applies the hot cp (1.088)
across the whole 222 -> 750 K rise where the true cp starts at 1.003. It
overstates the correction by a factor of 2.7 (-56.7 K against the true -15.3 K).
The same error at the old M 3.0 design point overstated -5.7 K as -24 K.

CONSEQUENCE FOR M5, and this is what the re-baseline changed. At M 3.0 the
material conclusion was robust: T_aw = 296 C against a Ti-6Al-4V limit of
350-400 C, a margin the gas model moved by 4 K. At M 3.5, T_aw = 421 C sits
ABOVE that limit, and this correction is worth 13 K of the gap. It is no longer
noise.
"""
inputs  = { mach = 3.5, static_temperature_k = 222.65 }
expect  = { stagnation_temperature_k = 752.8 }
rel_tol = 2e-3

[[case]]
name    = "post_normal_shock_M35_calorically_imperfect"
source  = "Rankine-Hugoniot solved with real enthalpy h(T) rather than constant cp, at M = 3.5, T1 = 222.65 K, by an independent implementation (analysis, Python). Air ideal-gas enthalpy tables [TO VERIFY]"
status  = "known_limit"
reason  = """
[QUANTIFIED 2026-08-27] This was carried as [TO QUANTIFY] for one revision. It is
now solved rather than estimated, so no invented number sits in this file.

Solving mass, momentum and energy across the shock with h(T) instead of constant
cp, closing on p = rho*R*T:

    quantity     perfect gas    real h(T)      delta
    u2           245.712 m/s    240.252 m/s    -2.2 %
    T2           738.10 K       726.27 K       -11.8 K, -1.60 %
    p2           30412.45 Pa    30605.01 Pa    +0.63 %
    rho2/rho1    4.2609         4.3577         +2.3 %
    M2           0.45115        0.44471        -1.4 %

All three conservation residuals close to exactly zero, which is what validates
the solve. The physical reading: a calorically imperfect gas absorbs part of the
compression into vibrational modes, so it heats LESS and compresses MORE than the
constant-cp model predicts.

This station is the one the re-baseline moved decisively. At M 3.0 it sat at
591 K, where gamma = 1.4 was borderline and arguably tolerable. At M 3.5 it is
738 K, squarely outside.

The perfect-gas module returns 738.10 K, so this case fails by 1.63e-2 until M2
grows a cp(T) path. Tolerance 5e-3 is loose enough to absorb the linear
interpolation of the enthalpy table on its 100 K grid, and tight enough that the
perfect-gas answer cannot pass.
"""
inputs  = { mach = 3.5, upstream_temperature_k = 222.65 }
expect  = { downstream_temperature_k = 726.27 }
rel_tol = 5e-3
