# M7 - Breguet cruise range, and the end-to-end check.
#
# This module is where the chain closes: V comes from M1, L/D from M6, Isp from
# M4, and the mass ratio from here. Nothing else in the project multiplies four
# modules together and compares the product against a real aircraft.
#
# It is also the corpus entry most exposed to its own inputs, and the tolerances
# below say so rather than hiding it.

# --- The end-to-end check -------------------------------------------------

[[case]]
name    = "sr71_unrefuelled_range"
source  = "SR-71 unrefuelled cruise range, about 5400 km, at M 3.2 with L/D about 6 and turboramjet Isp about 1900 s [TO CITE]"
reason  = """
THE TOLERANCE HERE IS NOT SET BY THE PRINTED PRECISION OF THE SOURCE, and that
departure has to be argued rather than assumed.

The model returns 5 549 km against a recited 5 400 km: 2.77 % high. Two
significant figures in "5400" would admit about 0.93 %, so at the precision rule
this project uses everywhere else, this case would fail.

It is not carried as a known_limit, because the gap is not a limitation of the
model. It is the uncertainty of the inputs, and that is measurable:

    L/D = 5.5   ->  5 087 km      Isp = 1800 s  ->  5 257 km
    L/D = 6.0   ->  5 549 km      Isp = 1900 s  ->  5 549 km
    L/D = 6.2   ->  5 734 km      Isp = 2000 s  ->  5 842 km

L/D = 5.84 reproduces the recited 5 400 km exactly. The whole 2.77 % gap is
inside the difference between "about 6" and 5.84 - smaller than the rounding
already present in the word "about". Three of the five inputs carry [TO CITE];
asserting the range to six-figure precision would be asserting precision that
none of them have.

So rel_tol = 0.05 is the uncertainty of the inputs, stated. It is a real check
even so: it rejects a model that is wrong by a factor, by a sign, by a missing
logarithm, or by a g0 that did not cancel - which is the class of error an
end-to-end test exists to catch. It would NOT catch a 3 % error, and that is
the honest limit of what this case can claim.
"""
inputs  = { velocity_m_s = 952.96, lift_to_drag = 6.0, specific_impulse_s = 1900.0, initial_mass_kg = 55000.0, final_mass_kg = 33000.0 }
expect  = { range_m = 5.4e6 }
rel_tol = 0.05

# --- Analytic identities: the source is the formula -----------------------

[[case]]
name    = "required_fuel_fraction_inverts_breguet"
source  = "R = V (L/D) Isp ln(1/(1-f)) inverted for f. THE SOURCE IS THE FORMULA: the round trip must return the fraction it started from."
reason  = """
A closed-form inverse, so the only interesting answer is the exact one. The
round trip loses half an ulp in exp(log(x)) and nothing else: 1.23e-16, which is
one ulp at 0.45.

[CORRECTED] The range input was first written to six decimal places, and the
case failed at 3.6e-14. The model was right; the CASE was truncating its own
input. Breguet inverted is f = 1 - exp(-R/K), so df/dR = exp(-R/K)/K, and with
K = V (L/D) Isp = 8.349e6 a rounding of 1e-6 m in R moves f by about 7e-14.
The number below is the full double, and the tolerance is now the arithmetic
rather than the transcription. Worth recording because the failure looked like
a physics error and was a data-entry error, which is the pattern that makes
people widen tolerances instead of reading them.

This is the check that keeps `required_fuel_fraction` honest. It is the function
a designer actually calls - "how much fuel does this range cost?" - and it is
the one place a sign or a reciprocal error would be invisible, because the
answer is a plausible number between 0 and 1 either way.
"""
inputs  = { velocity_m_s = 1046.95, lift_to_drag = 5.5, specific_impulse_s = 1450.0, range_m = 4991595.947330247 }
expect  = { fuel_fraction = 0.45 }
rel_tol = 2e-16

[[case]]
name    = "zero_fuel_gives_exactly_zero_range"
source  = "R = V (L/D) Isp ln(Wi/Wf) with Wi = Wf: ln(1) = 0 exactly in IEEE 754, for any finite V, L/D and Isp."
reason  = "Degenerate by construction, so the answer is exact and the tolerance is zero ulp. It pins the one boundary where a range model can quietly return a small positive number instead of nothing."
inputs  = { velocity_m_s = 1046.95, lift_to_drag = 5.5, specific_impulse_s = 1450.0, initial_mass_kg = 28000.0, final_mass_kg = 28000.0 }
expect  = { range_m = 0.0 }
ulp_tol = 0

# --- Zero-fuel mass: closing the [TO COMPUTE] M11 was carrying -------------

[[case]]
name    = "sr71_zero_fuel_mass_is_cited_not_recited"
source  = "NASA, 'The SR-71 Test Bed Aircraft: A Facility for High-Speed Flight Research', Table 1: 'Basic aircraft zero fuel weight 59,000 lb'. Cross-checked against the declassified SR-71 Flight Manual p. 1-4: 'Zero fuel weight varies from 56,500 to more than 60,000 pounds.'"
reason  = """
[CORRECTED] THIS REPLACES A NUMBER NO SOURCE SUPPORTS.

This project carried 30 600 kg as the SR-71 'empty mass' through four commits. It
is 67 461 lb, which is 12 % above the upper bound of the flight manual's stated
zero-fuel band. It had been recited, never read, and it was load-bearing: it is
the numerator of the fraction that derives VENTUS-1's mass and therefore sets
M11's cost estimate.

Two independent primary documents now agree. 59 000 lb from the NASA report sits
inside the 56 500 to 60 000 lb band the flight manual states.

ZERO FUEL WEIGHT, NOT EMPTY WEIGHT, and the distinction is the reason the whole
module was renamed. ZFW is the aircraft with everything aboard except fuel:
airframe, crew, oil, sensors. It is what the sources actually state and it is
measurable; 'empty weight' is ambiguous between manufacturer's and operating
empty, and the flight manual's 3 500 lb spread IS the sensor fit varying.
`close_cruise` therefore takes reserve fuel, not 'payload and reserve' - payload
is already inside this number, and the previous signature double-counted it.
"""
inputs  = { pounds = 59000.0 }
expect  = { kilograms = 26761.94983 }
rel_tol = 1e-15

[[case]]
name    = "ventus1_zero_fuel_mass_from_the_cited_anchor"
source  = "The cited SR-71 zero-fuel mass over a start-of-cruise mass of 55 000 kg [TO CITE], applied to the 28 t cruise mass M6b declares"
reason  = """
THE DERIVATION, AND EXACTLY HOW MUCH OF IT IS CITED.

The NUMERATOR is primary, as of the case above. The DENOMINATOR is not: the
flight manual gives loaded gross and zero fuel, not a cruise mass schedule, and
no primary source for a start-of-cruise mass has been found.

So this fraction is HALF-CITED, and that is written here rather than rounded off.
What the uncited denominator does have is consistency with the cited figures: it
must sit below the loaded gross of 61 235 to 63 503 kg and above the
end-of-cruise mass, and 55 000 kg does. That is consistency, not provenance, and
the distinction is the whole point of this project.

[CORRECTED] The fraction was 0.5564 over a recited mass. It is 0.4866, 12.5 %
lower, and VENTUS-1's derived mass falls from 15 578 kg to 13 624 kg. That
propagates into M11 and, as the next case records, overturns a published result.
"""
inputs  = { cruise_mass_kg = 28000.0, empty_fraction = 0.48658090600000004 }
expect  = { zero_fuel_mass_kg = 13624.265368 }
rel_tol = 1e-15

[[case]]
name    = "the_design_range_is_reserve_limited_not_impossible"
source  = "Breguet at the design point (V from M1, L/D from M6b, Isp from M4) with the cited-anchor zero-fuel mass and a 500 kg fuel reserve"
reason  = """
[CORRECTED] A RESULT THIS PROJECT PUBLISHED AND THAT DID NOT SURVIVE THE
CITATION. Recorded rather than quietly replaced.

Commit 41e665e reported, as its headline, that a 5000 km cruise requirement 'does
not close' at the design point, and that the aircraft arrived 194 kg lighter than
its own structure. That rested on two errors compounding: the recited 30 600 kg
zero-fuel mass, and a term that conflated payload with reserve so that payload
was counted twice.

With the cited mass the aircraft is 12.5 % lighter and the question turns
entirely on the reserve, which is a CHOICE nobody in this project has made:

    reserve   500 kg  ->  5714 km   the requirement closes
    reserve 3 176 kg  ->  4265 km   it does not
    (3 176 kg is the SR-71 reserve fraction, 11.3 %, scaled to 28 t)

So the honest statement is not '5000 km fails'. It is '5000 km is reserve-limited
and no reserve policy has been chosen'. The earlier claim was an artefact of an
uncited number, and it is the clearest example in this repository of why the
citation rule exists: the model was consistent, the tests were green, the
arithmetic was exact, and the conclusion was still wrong.
"""
inputs  = { cruise_mass_kg = 28000.0, zero_fuel_mass_kg = 13624.265368, reserve_fuel_kg = 500.0, velocity_m_s = 1046.946565, lift_to_drag = 5.5, specific_impulse_s = 1450.0 }
expect  = { range_m = 5713579.166984285, fuel_fraction = 0.49556195114285717, final_mass_kg = 14124.265368 }
rel_tol = 1e-15

[[case]]
name    = "the_jet_fighter_correlation_does_not_reach_this_regime"
source  = "Raymer empty-weight fraction for a jet fighter, We/W0 = 2.34 W0^-0.13 with W0 in pounds. THE SOURCE IS THE FORMULA. [TO VERIFY]"
reason  = """
Present to show why it is NOT the route used. At the SR-71's cited loaded gross
mass of 140 000 lb it returns 0.5014 against a cited zero-fuel fraction of
0.4214: it over-predicts the structural fraction by 19 %. Fighters are a
different kind of object from a vehicle that is more than half fuel and made of
titanium.

The direction matters. Over-predicting structure under-predicts fuel, which
under-predicts range, so the correlation would have made VENTUS-1 look WORSE
rather than better. It is still not used: a number being conservative is not the
same as it being right.

[CORRECTED] Both sides of this comparison used to be recited masses. Both are now
cited, and the over-prediction moved from 24 % to 19 % - which is the correction
being small enough not to change the conclusion, and large enough to be worth
having made.
"""
inputs  = { takeoff_mass_kg = 63502.931800000006 }
expect  = { raymer_empty_fraction = 0.5014402747777643 }
rel_tol = 1e-15

[[case]]
name    = "the_anchor_mass_is_start_of_cruise_not_mid_cruise"
source  = "The most generous SR-71 gross mass in the literature, 172 000 lb = 78 018 kg [TO CITE, tertiary], against the start-of-cruise mass the geometric mid-cruise reading would require"
reason  = """
AN AMBIGUITY IN THIS PROJECT'S OWN INPUTS, SETTLED BY THE MODEL RATHER THAN BY A
CITATION.

M7's doc comment called 55 t the MID-cruise mass while the case passed it as
`initial_mass_kg`, the START of cruise. The gap is the cruise fuel, 22 t. It was
invisible while 55 t only fed a range check with a wide band, and became
load-bearing the moment the zero-fuel derivation started dividing by it.

BOTH MID-CRUISE READINGS FAIL, FOR UNRELATED REASONS, which is what makes the
conclusion safe rather than merely convenient:

  geometric mean   55^2/33 = 91 667 kg at cruise start. Above ANY gross mass in
                   the literature, including the most generous tertiary figure
                   of 78 018 kg and far above the flight manual's cited 63 503
                   kg. Impossible, and it is the reading Breguet makes natural.

  arithmetic mean  2(55) - 33 = 77 000 kg, which IS possible, so it dies on
                   performance instead: 9 204 km against a published 5 400 km.

  start of cruise  5 549 km, 2.8 % over. The only reading that survives.

THE BOUND USED HERE IS THE GENEROUS ONE ON PURPOSE. Primary and tertiary sources
disagree about SR-71 gross mass by 23 % - the flight manual says 135 000 to
140 000 lb loaded, tertiary references say 170 000 to 172 000 lb maximum - and
this project does not pick between them. It does not have to: the refutation
holds against the LARGER figure, so it holds against whichever is true.
"""
inputs  = { anchor_mass_kg = 55000.0, end_of_cruise_mass_kg = 33000.0 }
expect  = { geometric_mid_cruise_implied_start_kg = 91666.66666666667 }
rel_tol = 1e-15
