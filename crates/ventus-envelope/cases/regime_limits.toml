# M12 - where the chain stops answering.
#
# EVERY CASE HERE IS A MODULE REFUSING, or this module reproducing a number
# another module already published. M12 computes no physics of its own, so there
# is nothing here that could need an external citation: the yardstick is the
# validity bound each module declares about itself, which is code in this
# repository and is tested where it lives.
#
# The refusal boundaries are pinned by BRACKETING - one case just inside, one
# just outside - rather than by asserting the result of a scan. A bracket says
# the same thing and does not depend on the scan resolution.

# --- Self-consistency: the sweep must reproduce the design point -----------

[[case]]
name    = "the_pressure_to_altitude_inversion_round_trips"
source  = "docs/design-point.md section 0: 26 km was chosen to hold dynamic pressure against the M 3.0 / 24 km baseline. Running that rule forwards must land back on it."
reason  = """
THE CHECK THAT MAKES THE REST OF M12 BELIEVABLE.

The altitude schedule is not an assumption this module invented; it is the rule
the project used to pick 26 km in the first place, so that changing Mach changes
the thermal and propulsive problems and leaves the structural loads case alone.

Running it forwards returns 25 999.92 m: 8 cm off the declared 26 000 m, which is
the bisection tolerance and not a physical discrepancy.

WHAT THE 8 cm PROVES, AND WHAT IT DOES NOT. It proves the bisection is a genuine
inverse of `at_geopotential`, and that the sweep is anchored to the same flight
condition as the design point - if this drifts, nothing else in M12 is comparable
to anything else in the project.

It proves NOTHING about whether the atmosphere is right. If US76 were
mis-implemented the round trip would still close to 8 cm, because both directions
would be wrong identically. M1's own cases against the published table are what
check that. This is a regression lock on the inversion and it is named for what
it tests, not for what it might be mistaken for.
"""
inputs  = { mach = 3.5, dynamic_pressure_pa = 18463.0 }
expect  = { altitude_m = 26000.0 }
abs_tol = 0.5

[[case]]
name    = "the_design_point_row_reproduces_m2"
source  = "docs/design-point.md section 3.1: T0 = 768.1 K calorically perfect at gamma = 1.4, M 3.5, 26 km"
reason  = "M12 asks M2 the same question the design point already answered. A different answer would mean the sweep is not flying the declared aircraft."
inputs  = { mach = 3.5 }
expect  = { stagnation_temperature_k = 768.1 }
rel_tol = 1.5e-4

# --- The engine ceiling, bracketed -----------------------------------------

[[case]]
name    = "every_module_still_answers_just_below_the_ceiling"
source  = "The refusals implemented in M1, M2, M3, M4 and M5. THE SOURCE IS THE CODE: each module's own declared validity bound."
reason  = """
The inside half of the bracket. At M 5.65 the whole chain still answers: the
atmosphere has altitude left, the gas model is inside its fit, the shocks are
attached, the burner can still add heat, and a material survives.

This is the headline of M12 and it is deliberately unglamorous: the model is good
to M 5.65, and the aircraft is designed at M 3.50. The gap is the honest margin
between what has been modelled and what has been claimed.

IT IS ALSO THE CEILING OF THE FOUR-RAMP DESIGN INLET, NOT OF THE CONCEPT. M3 is
asked at the design ramp count because that is the inlet this aircraft has. A
different ramp schedule moves this number, and quoting it as a property of ramjet
flight rather than of one configuration would be exactly the overreach M12 was
built to avoid.
"""
inputs  = { mach = 5.65 }
expect  = { refusal_count = 0.0 }
abs_tol = 0.0

[[case]]
name    = "the_ramjet_gives_out_first"
source  = "M4 ideal_ramjet refuses when ram total temperature reaches the 1700 K burner exit limit, so the cycle can add no heat."
reason  = """
The outside half of the bracket, and the first thing in the chain to go.

Note WHICH module it is. The intuitive answer to 'what stops a Mach 5 aircraft'
is the material. On this trajectory the material never binds at all - see the
next case - and the engine binds at M 5.70, because the burner temperature limit
caps exit velocity while flight speed keeps rising. That is M4's own recorded
finding, restated across a sweep instead of at a point.

[KNOWN_LIMIT, surfaced by M12] This ceiling is NOT the real end of the ramjet.
`ideal_ramjet` has no flame stability model, so it happily runs at a fuel-air
ratio of 0.0006. A real combustor stops far earlier, and BECAUSE BLOWOUT IS A
BAND RATHER THAN A POINT, so is the answer:

    phi 0.30  ->  M 4.42          phi 0.45  ->  M 3.58
    phi 0.35  ->  M 4.16          phi 0.50  ->  M 3.23
    phi 0.40  ->  M 3.89

[CORRECTED] This first reported the single crossing M 3.91, from phi = 0.4 alone.
A point estimate invites an argument about the point; the band does not, and the
band says something the point hid: THE DESIGN POINT SITS INSIDE IT. At the
permissive end the engine has 0.9 Mach of margin; at the strict end it has blown
out before reaching M 3.50. Which is true is not knowable from anything here.
"""
inputs  = { mach = 5.7 }
expect  = { refused_ramjet_thermally_choked = true, refusal_count = 1.0 }
abs_tol = 0.0

[[case]]
name    = "the_material_never_binds_on_this_trajectory"
source  = "M5 lightest_survivor over the candidate list, at the radiation-equilibrium wall temperature"
reason  = """
THE COUNTERINTUITIVE RESULT, AND THE ONE WORTH THE MODULE.

'Mach 5 melts everything' is a statement about constant ALTITUDE. Holding
dynamic pressure instead means climbing, and the density collapse takes the
convective heat flux with it. At M 5.70 the radiating wall at 10 m is still
around 715 K and Ti-6242S clears it; probed further the wall asymptotes near
843 K and Inconel 718 still survives.

WHAT THIS CASE DOES NOT CLAIM. It does not say the aircraft is thermally fine at
M 5.7 and it certainly says nothing about M 9. The gas model refuses at M 5.85,
and past that point every number M5 produces is a number about air the rest of
the chain has said it cannot describe. The claim is narrow and exact: WITHIN THE
RANGE WHERE THE CHAIN ANSWERS, the material is not what stops you.
"""
inputs  = { mach = 5.7 }
expect  = { refused_no_material_survives = false }
abs_tol = 0.0

[[case]]
name    = "the_gas_model_gives_out_second"
source  = "M2 gamma_air refuses outside its fitted 273-1800 K range; the stagnation temperature crosses 1800 K here."
reason  = """
The same refusal that is carried as a known limit at the COLD end, where the
design-point freestream at 222.65 K sits below the 273 K floor. This is the hot
end of the same correlation, reached by flying faster rather than by standing
still in cold air.

At M 5.85 two modules are now silent. Whatever M3 and M5 still print past here is
diagnostic - it says which module is still working - and is not a claim about
flight, because the gas model has already said it cannot describe this air.
"""
inputs  = { mach = 5.85 }
expect  = { refused_gas_model_out_of_range = true, refusal_count = 2.0 }
abs_tol = 0.0

# --- The engine wants a slower aircraft than it is in ----------------------

[[case]]
name    = "specific_thrust_peaks_well_below_the_design_point"
source  = "M4 ideal_ramjet specific thrust, swept. The peak is a property of the cycle: the burner limit caps exit velocity while flight speed keeps rising."
reason  = """
The ramjet's best point is M 2.30 at 723.4 N.s/kg. At the M 3.50 design point it
is already down to 83.7 % of that, and at M 5.00 to 35 %.

This is why a ramjet has a design Mach number, and it is a real cost of the
re-baseline from M 3.0 that the design point document does not currently state:
moving the aircraft faster moved it further down the engine's own curve.
"""
inputs  = { mach = 2.3 }
expect  = { ramjet_specific_thrust_n_s_kg = 723.4378224723 }
rel_tol = 1e-12

[[case]]
name    = "specific_impulse_diverges_as_the_engine_dies"
source  = "Isp = F / (m_dot g). As ram total temperature approaches the burner limit the fuel-air ratio falls to zero faster than the thrust does, so the ratio diverges. THE SOURCE IS THE FORMULA."
reason  = """
[CORRECTED] THE TRAP THIS MODULE ALMOST SHIPPED.

The first version of the sweep printed specific impulse as a headline column.
At M 5.50 it reads 4020 s, and at M 5.62 it reads 12 674 s, against roughly
1900 s at the design point. Read straight off a table those look like a
discovery. They are an engine producing almost nothing, very efficiently: the
thrust at M 5.50 is 115 N.s/kg against 723 at the peak, and the fuel-air ratio
has fallen to 0.0029.

Arithmetically correct, physically meaningless, and exactly the class of number
this project exists not to publish. The reports now print SPECIFIC THRUST, which
collapses monotonically and is the honest signal, and `ramjet_isp_is_meaningful`
flags the divergence rather than silently blanking the field.

This case pins the divergence so that nobody 'fixes' it back into the reports.
"""
inputs  = { mach = 5.5 }
expect  = { ramjet_specific_impulse_s = 4020.441110971, ramjet_specific_thrust_n_s_kg = 115.173063773, ramjet_isp_is_meaningful = false }
rel_tol = 1e-11

# --- The fourth frontier: the only one about the VEHICLE --------------------

[[case]]
name    = "the_design_point_runs_high_in_the_blowout_band"
source  = "M4 ideal_ramjet fuel-air ratio at the design point, over a stoichiometric kerosene-air f/a of 0.0680 [TO CITE]"
reason  = """
THE SINGLE NUMBER THAT DECIDES WHETHER THIS AIRCRAFT FLIES.

The cycle runs at f/a = 0.03138 at M 3.50, an equivalence ratio of 0.4615. The
lean blowout band this project carries is phi 0.3 to 0.5 [TO CITE]. So the design
point sits INSIDE the band and ABOVE its midpoint.

THE PROBABILITY MASS IS NOT EVENLY SPLIT, and saying "the design point is inside
the uncertainty" understates it. phi 0.46 to 0.50 is an ordinary range for a
ramjet combustor without a dedicated flame holder, and every value in it puts the
design point out of reach - not marginal, unreachable.

CONSEQUENCE FOR THE CITATION QUEUE. This project carries [TO CITE] on L/D and on
Isp, and those move a result by some per cent. This one decides between "the
design point has margin" and "the design point does not fly". It goes first.
"""
inputs  = { mach = 3.5 }
expect  = { equivalence_ratio = 0.46149, fuel_air_ratio = 0.0313813 }
rel_tol = 1e-4

[[case]]
name    = "the_required_capture_area_outgrows_the_body"
source  = "Thrust equals Fs * rho * V * A_c against M6b drag in newtons, solved for A_c, over the Sears-Haack body cross-section M6b derives"
reason  = """
THE ONLY FRONTIER HERE THAT IS ABOUT THE VEHICLE RATHER THAN THE MODEL.

The other four say where a correlation leaves its fit or a solver has nothing
left to say. This one asks whether the aircraft can swallow enough air to
overcome its own drag.

M3 has no capture area - `ventus-inlet` carries an explicit TODO for it - so
"is there excess thrust?" cannot be answered without inventing one. INVERTING THE
QUESTION NEEDS NOTHING INVENTED: drag comes out of M6b in newtons, specific
thrust out of M4 in N.s/kg, and the capture area that balances them falls out.

    M 3.50   A_req / A_body = 0.745
    M 3.85   A_req / A_body = 1.000

WHAT A RATIO ABOVE 1 MEANS, STATED CAREFULLY. It does NOT prove the aircraft is
impossible. It proves the configuration M6b assumed is SELF-INCONSISTENT: the
Sears-Haack body that sets the wave drag cannot also host an inlet larger than
itself. Closing the balance past there needs wing-mounted nacelles, which change
the frontal area and the wave drag that this very drag number came from.

That is a weaker claim than impossibility and far harder to argue with.

AND IT BINDS AT M 3.85 - below the middle of the lean blowout band, and nearly
two Mach below the M 5.70 ceiling M4 reports. The engine ceiling was never the
operative limit.
"""
inputs  = { mach = 3.5 }
expect  = { capture_area_ratio = 0.7454 }
rel_tol = 1e-3

[[case]]
name    = "no_body_size_closes_the_thrust_balance_above_m4p5"
source  = "Sears-Haack wave drag goes as the square of cross-section (ventus-aero/src/drag.rs). Substituting A_body = A_capture gives k A^2 - (Fs rho V) A + D_others = 0; above this Mach the discriminant is negative and the roots do not exist."
reason  = """
[CORRECTED] THE CAPTURE-AREA NUMBER WAS A FIRST ITERATE, NOT A FIXED POINT.

Wave drag goes as the SQUARE of maximum cross-section, so growing the inlet grows
the body grows the drag grows the inlet. `required_capture_area_m2` evaluates
that once against the declared geometry. It is a fixed point and it needed
solving.

DOES IT CONVERGE? dA_req/dA = 2 (D_wave/D_total) (A_req/A). The factor
2 (A_req/A) is 1.49 at the design point, so a wave-dominated drag budget would
DIVERGE and no stable body size would exist. Measured, wave drag is 8.9 % of the
total - lift-induced is 66 %, which is M6b's own headline finding turning out to
be load-bearing somewhere else entirely - giving 0.133. Comfortably convergent.

WHAT THE CORRECTION IS WORTH. At the crossing, nothing - and that is a TAUTOLOGY,
NOT A CORROBORATION. Where A = A_body the two formulations evaluate the same drag
by construction, so agreement there is guaranteed in advance and carries no
information. It is the one Mach where they cannot disagree, and reading it as
"two methods agree" gets it exactly backwards. Away from it they
part in opposite directions - below, the fixed-drag answer is CONSERVATIVE
(2.401 against 2.511 m2 at M 3.50); above, it is OPTIMISTIC (7.080 against
5.655 m2 at M 4.40, 25 % low).

AND THE FRONTIER THE FIRST FORMULATION COULD NOT SEE. When the discriminant goes
negative the roots stop existing: not gradual degradation, NO BODY SIZE CLOSING
THE BALANCE AT ALL, at M 4.536. The fixed-drag formulation happily returns a
number up there, which is why it could not stay the headline.

IT IS NOT A NEW OPERATIONAL LIMIT. Past M 3.847 the inlet is already larger than
the body carrying it, so M 4.536 sits INSIDE a region M 3.847 has already
excluded, and there is no usable band between them. What it adds is the CHARACTER
of the failure - past there the aircraft does not get gradually worse, the
solution stops existing - which is a statement about the equation rather than a
ceiling anyone could fly to.
"""
inputs  = { mach = 4.6 }
expect  = { any_body_closes_the_thrust_balance = false }
abs_tol = 0.0

[[case]]
name    = "a_body_still_closes_just_below_that"
source  = "Same quadratic, evaluated inside the region where the discriminant is positive"
reason  = "The inside half of the bracket. At M 4.5 a body size still exists that closes the thrust balance; at M 4.6 none does."
inputs  = { mach = 4.5 }
expect  = { any_body_closes_the_thrust_balance = true }
abs_tol = 0.0
