reason  = """
NOT A DESIGN POINT. Programme intent is cruise ≥ Mach 4; the validated snapshot
remains M 3.50 at 26 km.

This case pins that, on the CURRENT geometry, required capture already exceeds
the body at the proposed row (ratio 1.146). A ratio above 1 is
self-inconsistency, not a closing number. A larger Sears-Haack still has a
quadratic root here (any_body_closes = true) because M 4.00 is below M 4.536;
that is a different aeroplane, recorded so the two frontiers are not collapsed.

The named M 4 candidate (fineness 10, same length) is a *separate* case,
`m4_candidate_geometry_hosts_capture_at_proposed_m4`. Do not collapse the
two. M3 now owns the capture-vs-body identity (`ventus_inlet::capture_to_body_ratio`);
this case is the thrust-drag inversion feeding it. DO NOT RETUNE the expect
