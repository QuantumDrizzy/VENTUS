# M3 — capture, spillage, Kantrowitz starting, declared-lip additive drag,
# spike/unstart refusals.
#
# Recovery remains in recovery.toml. These cases are identities, one cited
# 1-D limit, and a pitot-equivalent additive force once a lip is declared.
# Without a lip, the force is still refused. Lip suction is not credited.

[[case]]
name    = "kantrowitz_at_design_mach"
source  = "Kantrowitz & Donaldson, NACA ACR L5D20 (WR L-713), 1945: Ae/At after a normal shock at the entrance equals (A/A*) at the post-shock Mach. THE SOURCE IS THE COMPOSITION of NACA 1135 relations already in M2."
reason  = """
THE 1-D STARTING LIMIT, COMPOSED RATHER THAN TRANSCRIBED.

At M 3.5 a normal shock leaves M2 = 0.45115 (NACA 1135). A/A* there is the
largest internal contraction that will self-start. It is about 1.45 against an
isentropic A/A* of about 6.79 at the same Mach — that gap is why a
mixed-compression inlet needs a translating spike, and it is a property of the
gas, not of a geometry this project has not drawn.
"""
inputs  = { mach = 3.5, gamma = 1.4 }
expect  = { kantrowitz_contraction = 1.447, isentropic_contraction = 6.790 }
rel_tol = 5e-3

[[case]]
name    = "kantrowitz_infinite_mach_limit"
source  = "Flock & Gülhan, AIAA J. 57(6) 2019 eq. (4), after Kantrowitz & Donaldson 1945: lim M→∞ Ae/At = 1.666 at gamma = 1.4. Implemented as A/A* at the infinite-Mach post-shock Mach sqrt((γ−1)/(2γ))."
reason  = """
A mixed-compression inlet cannot buy unlimited starting contraction by flying
faster. The ceiling is 1.666 at gamma = 1.4. Probed at M = 1e6 rather than by
taking a limit in closed form, so a drift in M2's area-ratio or shock relations
cannot hide behind a typed constant.
"""
inputs  = { mach = 1.0e6, gamma = 1.4 }
expect  = { kantrowitz_contraction = 1.666 }
rel_tol = 1e-3

[[case]]
name    = "capture_fits_the_body_at_the_design_point_ratio"
source  = "Identity: A_capture / A_body. The 0.745 figure is M12's design-point capture_area_ratio; this case asserts the inlet-side identity, not the thrust-drag inversion that produced the 0.745."
reason  = """
At the validated snapshot the required capture is 74.5 % of the Sears-Haack
body. The body can host it. Past M 3.85 it cannot — that is a different case.
"""
inputs  = { capture_area_m2 = 2.511, body_area_m2 = 3.369 }
expect  = { capture_to_body_ratio = 0.7453, body_can_host_capture = true }
rel_tol = 1e-3

[[case]]
name    = "capture_exceeds_the_body_at_the_proposed_m4_ratio"
source  = "docs/design-point-m4.md: proposed M 4.00 capture/body ≈ 1.146 on the current Sears-Haack. Identity on two areas; THE SOURCE IS THE RATIO, not a closed design point."
reason  = """
NOT A DESIGN POINT. Programme intent is cruise ≥ Mach 4; the snapshot remains
M 3.50. On the current body the required capture already exceeds the
cross-section. A ratio above 1 is self-inconsistency. This crate does not close
that by inventing nacelles.

DO NOT RETUNE the expect toward 1.0 to look like a close. If a new body
lands as the *snapshot*, the areas are rewritten in the same change. The
M 4 candidate is a different case (`m4_candidate_body_hosts_the_proposed_m4_capture`),
not a quiet edit of this one.
"""
inputs  = { capture_area_m2 = 3.859, body_area_m2 = 3.369 }
expect  = { capture_to_body_ratio = 1.1454, body_can_host_capture = false }
rel_tol = 1e-3

[[case]]
name    = "m4_candidate_body_hosts_the_proposed_m4_capture"
source  = "Identity: A_capture / A_body. Areas are the M 4 candidate's first-iterate capture and Sears-Haack station from M12 (fineness 10, same length as the snapshot). THE SOURCE IS THE RATIO, not a closed design point."
reason  = """
The snapshot body cannot host 3.859 m2. The named candidate station is
4.851 m2 and the capture that body actually requires (wave drag included)
is 4.191 m2. Ratio 0.864, below 1. This crate still does not invent a
cowl or a flame holder. The snapshot case above must stay red on hosting.
"""
inputs  = { capture_area_m2 = 4.191, body_area_m2 = 4.851 }
expect  = { capture_to_body_ratio = 0.8639, body_can_host_capture = true }
rel_tol = 1e-3

[[case]]
name    = "shock_on_lip_spills_nothing"
source  = "Mass-flow ratio μ = A0/Ac. At shock-on-lip, A0 = Ac, spilled area is zero. THE SOURCE IS THE DEFINITION."
reason  = "A started external-compression inlet at design has no additive streamtube to charge. With a declared lip the newton is zero; without one it is refused."
inputs  = { streamtube_area_m2 = 2.511, cowl_area_m2 = 2.511 }
expect  = { mass_flow_ratio = 1.0, spilled_area_m2 = 0.0, capture_exceeds_cowl = false }
rel_tol = 1e-12

[[case]]
name    = "subcritical_cowl_spills_the_leftover_area"
source  = "Spilled area = (Ac − A0)+. Identity, not a drag correlation."
reason  = """
When the cowl is larger than the captured streamtube the difference is spilled.
This is the hook. Additive drag in newtons is a different question: without a
declared lip it is refused; with one, see declared_lip_subcritical_spillage_force.
"""
inputs  = { streamtube_area_m2 = 2.0, cowl_area_m2 = 3.0 }
expect  = { mass_flow_ratio = 0.6666666666666666, spilled_area_m2 = 1.0, capture_exceeds_cowl = false }
rel_tol = 1e-12

[[case]]
name    = "additive_drag_without_a_lip_is_refused"
source  = "Seddon & Goldsmith, Intake Aerodynamics: additive drag is a control-volume force that needs a cowl lip. Without a declared lip the force is refused. THE SOURCE IS THE DEFINITION, not a C_D(μ) fudge."
reason  = """
An incompressible C_D = 2 μ (1−μ) at M 3.5 would be a number about the wrong
physics. The spilled area is emitted; the force is not. A case that asks for
additive_drag_n without a lip must fail closed. Declaring a lip is a
different case.
"""
inputs  = { streamtube_area_m2 = 2.0, cowl_area_m2 = 3.0 }
expect  = { refused_cowl_lip_not_modelled = true, spilled_area_m2 = 1.0 }
abs_tol = 0.0

[[case]]
name    = "spike_schedule_refuses_at_the_design_point"
source  = "docs/PRIMER.md and ventus-inlet: a mixed-compression inlet needs a translating spike to hold the internal shock system. This aircraft has no spike geometry. THE SOURCE IS THE GAP."
reason  = """
Kantrowitz says why the spike exists (isentropic contraction 6.79 against a
starting limit of 1.45 at M 3.5). It does not say where the spike is. Asking
for a position must refuse with SpikeScheduleNotModelled, never a stroke in
metres.
"""
inputs  = { mach = 3.5, request_spike_schedule = true }
expect  = { refused_spike_schedule_not_modelled = true }
abs_tol = 0.0

[[case]]
name    = "unstart_margin_refuses_at_the_design_point"
source  = "Same gap: unstart (shock expulsion) needs an operating throat and a back-pressure. Neither is declared. THE SOURCE IS THE GAP."
reason  = """
self_starts(M, γ, Ae/At) is the 1-D Kantrowitz criterion and is modelled.
A margin in newtons or milliseconds is not. The request is well-formed and
the answer is a refusal — the same contract as ventus-scram.
"""
inputs  = { mach = 3.5, request_unstart_margin = true }
expect  = { refused_unstart_dynamics_not_modelled = true }
abs_tol = 0.0

[[case]]
name    = "declared_lip_shock_on_lip_additive_drag_vanishes"
source  = "Seddon & Goldsmith pre-entry force on spilled projected area. At shock-on-lip the spilled area is zero, so D_add is identically zero. THE SOURCE IS THE DEFINITION. Atmosphere: docs/design-point.md §1–2."
reason  = """
THE CASE THAT USED TO BE A REFUSAL, WITH A LIP.

A declared cowl (highlight = streamtube, r/R = 0.02 [TO DETERMINE]) unlocks
the force. At design operation there is nothing to charge. Lip suction is
not in this number.
"""
inputs  = { streamtube_area_m2 = 2.511, cowl_area_m2 = 2.511, lip_radius_ratio = 0.02, static_pressure_pa = 2153.09, density_kg_m3 = 0.0336882, velocity_m_s = 1046.95, gamma = 1.4 }
expect  = { additive_drag_n = 0.0, additive_drag_coefficient = 0.0, mass_flow_ratio = 1.0, spilled_area_m2 = 0.0, refused_cowl_lip_not_modelled = false, additive_drag_within_stated_range = true }
abs_tol = 1e-6

[[case]]
name    = "declared_lip_subcritical_spillage_force"
source  = "Pitot-equivalent additive drag D_add = (p2 − p∞) (Ac − A0)+, with p2/p∞ from NACA 1135 / M2 normal_shock at the freestream Mach. Atmosphere: docs/design-point.md §1–2. [TO CITE] Seddon & Goldsmith, Intake Aerodynamics, additive-drag / pre-entry chapter, for the streamtube force; the p2 closure is composed, not transcribed."
reason  = """
THE NEWTON A DECLARED LIP UNLOCKS.

μ = 2/3 at the M 3.50 / 26 km snapshot atmosphere. This is not
C_D = 2μ(1−μ) = 0.444 — that is the incompressible sharp-lip identity, the
wrong regime. The pitot sketch gives C_D,add ≈ 0.510. A four-ramp external
field is not this number. Lip suction is not credited (r/R is a flag).
The force is not folded into M6b drag.
"""
inputs  = { streamtube_area_m2 = 2.0, cowl_area_m2 = 3.0, lip_radius_ratio = 0.02, static_pressure_pa = 2153.09, density_kg_m3 = 0.0336882, velocity_m_s = 1046.95, gamma = 1.4 }
expect  = { additive_drag_n = 28259.5, additive_drag_coefficient = 0.5102, mass_flow_ratio = 0.6666666666666666, spilled_area_m2 = 1.0, refused_cowl_lip_not_modelled = false, additive_drag_within_stated_range = true }
rel_tol = 1e-3

[[case]]
name    = "declared_lip_refuses_when_capture_exceeds_the_cowl"
source  = "Mass-flow ratio μ = A0/Ac > 1 is not spillage. THE SOURCE IS THE OPERATING POINT."
reason  = """
A lip does not invent a force for a highlight that cannot swallow the
streamtube. That is CaptureExceedsCowl, the same refusal the snapshot
design cowl returns at the proposed M 4.00 row.
"""
inputs  = { streamtube_area_m2 = 4.0, cowl_area_m2 = 3.0, lip_radius_ratio = 0.02, static_pressure_pa = 2153.09, density_kg_m3 = 0.0336882, velocity_m_s = 1046.95, gamma = 1.4 }
expect  = { refused_capture_exceeds_cowl = true, capture_exceeds_cowl = true, refused_cowl_lip_not_modelled = false }
abs_tol = 0.0

[[case]]
name    = "lip_suction_is_not_credited"
source  = "Seddon & Goldsmith: lip suction on a blunt cowl can cancel additive drag. This crate records r/R and refuses to invent C_s(r/R, M). Same missing-key mechanism as M11 programme_cost_usd_1986_verified."
status  = "known_limit"
reason  = """
THE FORCE THIS MODULE IS NOT ALLOWED TO PRINT FROM A LIP RADIUS ALONE.

A declared lip unlocks the pre-entry (spillage) force. The blunt-lip credit
that would lower it is a different number, and there is no cited suction
correlation in this repository. [TO CITE] Seddon & Goldsmith for C_s(r/R, M).
Until then no report should quote net spillage drag after suction. Two lips
that differ only in r/R currently return the same D_add; that is the honesty.
"""
inputs  = { streamtube_area_m2 = 2.0, cowl_area_m2 = 3.0, lip_radius_ratio = 0.02, static_pressure_pa = 2153.09, density_kg_m3 = 0.0336882, velocity_m_s = 1046.95, gamma = 1.4 }
expect  = { lip_suction_force_n = 0.0 }
abs_tol = 0.0

