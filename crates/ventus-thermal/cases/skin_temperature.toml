# M5 - radiation-equilibrium skin temperature.
#
# The anchor is the SR-71: published skin temperatures of 250-300 C over most of
# the airframe at M 3.2 cruise, nose around 315 C. This model is a flat plate, so
# it is checked where a flat plate is a fair representation.

[[case]]
name    = "sr71_forward_body_skin_temperature"
source  = "SR-71 cruise skin temperature, published as 250-300 C over most of the airframe at M 3.2 / ~24 km [TO CITE]"
reason  = """
THE ANCHOR FOR M5. Flat-plate radiation balance at the SR-71 cruise condition,
1 m from the leading edge, gives 543.4 K = 270.2 C - inside the published band.

The expected value below is the midpoint of the published band, 275 C = 548.15 K,
and the tolerance is +/- 25 C expressed as a relative 4.6e-2, which is the HALF
WIDTH OF THE PUBLISHED BAND ITSELF. The yardstick is a range, so the tolerance is
that range; tightening it would be asserting a precision the source does not have.
"""
inputs  = { geopotential_altitude_m = 24000.0, mach = 3.2, running_length_m = 1.0, emissivity = 0.85, sink_temperature_k = 0.0 }
expect  = { wall_temperature_k = 548.15 }
rel_tol = 4.6e-2

[[case]]
name    = "ventus1_design_point_skin_temperature"
source  = "Radiation balance at the r4 design point; independent implementation analysis/skin_crosscheck.py (added 2026-10-01; before that this citation pointed at nothing) gives 548.305 K and 709.290 K"
reason  = """
The number docs/design-point.md section 3.2 quotes. An earlier revision of that
document ESTIMATED 590-640 K for the flat panels before this module existed; the
computed answer is 548.3 K at 10 m, so the estimate was 40-90 K too high. The
document was corrected to the computed value.
"""
inputs  = { geopotential_altitude_m = 26000.0, mach = 3.5, running_length_m = 10.0, emissivity = 0.85, sink_temperature_k = 0.0 }
expect  = { wall_temperature_k = 548.3, adiabatic_wall_temperature_k = 709.3 }
rel_tol = 1e-3

[[case]]
name    = "radiation_relief_decides_the_material"
source  = "Ti-6Al-4V sustained service limit, creep-limited, taken as 350 C = 623 K [TO CITE]"
reason  = """
THE RESULT OF THE MODULE, expressed as a number the harness can check.

At the design point the adiabatic wall sits at 709.3 K, ABOVE the Ti-6Al-4V
limit of 623 K. The radiating wall sits at 548.3 K, BELOW it. The gap between
them - what radiation is worth - is 161 K, and it is the entire reason the flat
panels can be conventional titanium rather than beta-titanium or a superalloy.

If this number ever falls below about 90 K the material conclusion flips, so it
is asserted rather than left as prose.
"""
inputs  = { geopotential_altitude_m = 26000.0, mach = 3.5, running_length_m = 10.0, emissivity = 0.85, sink_temperature_k = 0.0 }
expect  = { radiation_relief_k = 161.0 }
rel_tol = 2e-2

# M 4.00, the design-q row (ADR-008 amendment 1). Pinned to analysis/skin_crosscheck.py, which shares
# no code with this crate (own US76, recovery, Eckert, friction, analogy and solver).

[[case]]
name    = "m4_forward_panel_is_above_the_ti6al4v_limit"
source  = "analysis/skin_crosscheck.py at M 4.00, 27 747.256 m geopotential, x = 1 m, eps 0.85, sink 0 K; Ti-6Al-4V limit 623 K [TO CITE] as radiation_relief_decides_the_material"
reason  = """
ADR-008 AMENDMENT 1, P-A2 (holds for this station). At M 4.00 the adiabatic wall is 865.0 K and the
forward flat panel radiates down only to 638.8 K -- 16 K above the 623 K the corpus uses for
Ti-6Al-4V. Radiation no longer keeps the first metres of every surface in conventional titanium.
"""
inputs  = { geopotential_altitude_m = 27747.25646305947, mach = 4.0, running_length_m = 1.0, emissivity = 0.85, sink_temperature_k = 0.0 }
expect  = { wall_temperature_k = 638.8028073102423, adiabatic_wall_temperature_k = 864.997310137901, heat_transfer_coefficient_w_m2_k = 35.48263635479343 }
rel_tol = 1e-4

[[case]]
name    = "m4_ten_metre_panel_clears_it"
source  = "analysis/skin_crosscheck.py at M 4.00, x = 10 m"
reason  = """
ADR-008 AMENDMENT 1, P-A2 (FAILS as worded). The 10 m panel settles at 597.1 K -- 26 K under 623 K,
outside the +-20 K the amendment predicted. Relief 267.9 K against ~240 predicted. The panel is
titanium-capable; the crossing is at 2.41 m from each leading edge (analysis/skin_crosscheck.py).
"""
inputs  = { geopotential_altitude_m = 27747.25646305947, mach = 4.0, running_length_m = 10.0, emissivity = 0.85, sink_temperature_k = 0.0 }
expect  = { wall_temperature_k = 597.0736835439494, radiation_relief_k = 267.92362659395155 }
rel_tol = 1e-4
